name: Validate distribution server

on:
  push:
    paths:
      - ".github/workflows/server-checks.yml"
      - "scripts/**"
      - "tests/**"
      - "catalog/**"
      - "public/index.html"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
